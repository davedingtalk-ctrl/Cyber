<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Legend — Admin</title>
<style>
:root{--bg:#050810;--card:rgba(255,255,255,0.045);--card-b:rgba(120,170,255,0.18);--primary:#3b82f6;--text:#e8eefb;--muted:#8ea0c2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.box{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:22px;margin-bottom:18px;}
.box h2{font-size:1.1rem;margin-bottom:14px;}
label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 5px;}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--card-b);border-radius:8px;padding:9px 11px;color:var(--text);font-size:.88rem;font-family:inherit;}
textarea{min-height:70px;resize:vertical;}
input[type=color]{padding:2px;height:38px;}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:.85rem;margin-top:10px;cursor:pointer;}
.btn.ghost{background:transparent;border:1px solid var(--card-b);color:var(--text);}
.btn.danger{background:#ef4444;}
.mini{padding:5px 9px;font-size:.72rem;border-radius:6px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--card-b);background:var(--card);font-size:.82rem;cursor:pointer;}
.tab.active{background:var(--primary);border-color:var(--primary);}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{font-size:.75rem;color:var(--muted);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:6px;}
.stat{background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:16px;text-align:center;}
.stat b{display:block;font-size:1.3rem;}
.stat span{color:var(--muted);font-size:.78rem;}
a{color:var(--primary);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar"><div style="font-weight:700;font-size:1.1rem;">Admin Panel</div><a href="../">← View site</a></div>

  <div id="loginBox" class="box">
    <h2>Sign in</h2>
    <label>Username</label><input id="loginUser">
    <label>Password</label><input id="loginPass" type="password">
    <button class="btn" onclick="doLogin()">Log in</button>
    <p class="pill" id="loginMsg" style="margin-top:8px;"></p>
    <p class="pill" style="margin-top:14px;">First time here? Run <code>api/setup.php</code> once in your browser to create the default admin login (admin / admin123), then log in and change it under Security.</p>
  </div>

  <div id="adminBody" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <div id="tabContent"></div>
    <button class="btn ghost" onclick="doLogout()">Log out</button>
  </div>
</div>

<script>
const API='../api/';
function j(url,opts={}){ return fetch(API+url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts}).then(r=>r.json()); }
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let DATA=null;
const SOC_TYPES=['WhatsApp','Instagram','Telegram','Facebook','YouTube','TikTok','X/Twitter','Custom'];
const SOC_ICON={WhatsApp:'💬',Instagram:'📷',Telegram:'✈️',Facebook:'📘',YouTube:'▶️',TikTok:'🎵','X/Twitter':'✕',Custom:'🔗'};

async function init(){
  const s = await j('session.php');
  if(s.authenticated){ showBody(); } else { document.getElementById('loginBox').style.display='block'; }
}
async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const r = await j('login.php',{method:'POST',body:JSON.stringify({username,password})});
  if(r.ok){ showBody(); } else { document.getElementById('loginMsg').textContent = r.error||'Login failed.'; }
}
async function doLogout(){ await j('logout.php',{method:'POST'}); location.reload(); }

async function showBody(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBody').style.display='block';
  await refresh();
  renderTabs();
}
async function refresh(){ DATA = await j('admin_data.php'); }

const TABS=['Dashboard','Profile','Social Links','Sections','Theme','Loading & SEO','Security'];
let activeTab='Dashboard';
function setTab(t){ activeTab=t; renderTabs(); }
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>`<div class="tab ${t===activeTab?'active':''}" onclick="setTab('${t}')">${t}</div>`).join('');
  renderContent();
}

async function renderContent(){
  const c=document.getElementById('tabContent');
  const p=DATA.profile||{stats:[]}, th=DATA.theme||{}, l=DATA.loader||{}, seo=DATA.seo||{};

  if(activeTab==='Dashboard'){
    const stats = await j('analytics.php');
    c.innerHTML=`<div class="box"><h2>Overview</h2><div class="stats">
      <div class="stat"><b>${stats.totalVisits||0}</b><span>Total visits</span></div>
      <div class="stat"><b>${stats.todayVisits||0}</b><span>Today</span></div>
      <div class="stat"><b>${stats.pageViews||0}</b><span>Page views</span></div>
      <div class="stat"><b>${stats.clicks||0}</b><span>Link clicks</span></div>
      </div></div>
      <div class="box"><h2>Recent activity</h2>${(stats.recent||[]).map(e=>`<div class="list-item"><span>${e.event_type} · ${e.device}/${e.browser}</span><span class="pill">${e.created_at}</span></div>`).join('')||'<p class="pill">No activity yet.</p>'}</div>`;
  }

  if(activeTab==='Profile'){
    c.innerHTML=`<div class="box"><h2>Profile</h2>
      <label>Name</label><input id="f_name" value="${esc(p.name)}">
      <label>Tagline</label><input id="f_tag" value="${esc(p.tagline)}">
      <label>About</label><textarea id="f_about">${esc(p.about)}</textarea>
      <label>Profile picture</label><input id="f_dp" type="file" accept="image/*">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f_badge" style="width:auto;" ${p.badge==1?'checked':''}> Verification badge</label>
      <button class="btn" onclick="saveProfile()">Save profile</button></div>
      <div class="box"><h2>Stats cards</h2><div id="statsEdit">${(p.stats||[]).map((s,i)=>`<div class="list-item"><input style="width:40%" value="${esc(s.label)}" onchange="p.stats[${i}].label=this.value"><input style="width:30%" value="${esc(s.value)}" onchange="p.stats[${i}].value=this.value"><button class="btn danger mini" onclick="delStat(${i})">✕</button></div>`).join('')}</div>
      <button class="btn ghost" onclick="addStat()">+ Add stat</button> <button class="btn" onclick="saveStatsOnly()">Save stats</button></div>`;
  }

  if(activeTab==='Social Links'){
    const socs=[...(DATA.socials||[])].sort((a,b)=>a.sort_order-b.sort_order);
    c.innerHTML=`<div class="box"><h2>Social links</h2>
      ${socs.map(s=>`<div class="list-item"><span>${SOC_ICON[s.type]||'🔗'} ${esc(s.type)} — <span class="pill">${esc(s.url)}</span></span>
        <span class="row">
          <button class="btn ghost mini" onclick="moveSoc(${s.id},-1)">↑</button>
          <button class="btn ghost mini" onclick="moveSoc(${s.id},1)">↓</button>
          <button class="btn ghost mini" onclick="toggleSoc(${s.id})">${s.enabled==1?'On':'Off'}</button>
          <button class="btn danger mini" onclick="delSoc(${s.id})">✕</button>
        </span></div>`).join('')}
      <div style="margin-top:14px;">
        <label>Type</label><select id="ns_type">${SOC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
        <label>URL</label><input id="ns_url" placeholder="https://...">
        <button class="btn" onclick="addSoc()">+ Add link</button>
      </div></div>`;
  }

  if(activeTab==='Sections'){
    const secs=[...(DATA.sections||[])].sort((a,b)=>a.sort_order-b.sort_order);
    c.innerHTML=`<div class="box"><h2>Sections</h2>
      ${secs.map(s=>`<div class="list-item"><span>${s.icon||'⚡'} ${esc(s.title)}</span>
        <span class="row">
          <button class="btn ghost mini" onclick="moveSec(${s.id},-1)">↑</button>
          <button class="btn ghost mini" onclick="moveSec(${s.id},1)">↓</button>
          <button class="btn ghost mini" onclick="toggleSec(${s.id})">${s.visible==1?'Shown':'Hidden'}</button>
          <button class="btn ghost mini" onclick="editSec(${s.id})">Edit</button>
          <button class="btn danger mini" onclick="delSec(${s.id})">✕</button>
        </span></div>`).join('')}
      <button class="btn ghost" onclick="addSec()" style="margin-top:12px;">+ Add section</button></div>
      <div id="secEditor"></div>`;
  }

  if(activeTab==='Theme'){
    c.innerHTML=`<div class="box"><h2>Theme</h2>
      <label>Primary color</label><input type="color" id="t_primary" value="${th.primary_color||'#3b82f6'}">
      <label>Secondary color</label><input type="color" id="t_secondary" value="${th.secondary_color||'#22d3ee'}">
      <label>Background</label><input type="color" id="t_bg" value="${th.bg_color||'#050810'}">
      <label>Glow intensity</label><input type="range" id="t_glow" min="0" max="1" step="0.05" value="${th.glow||0.55}">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="t_anim" style="width:auto;" ${th.animations==1?'checked':''}> Animations enabled</label>
      <button class="btn" onclick="saveTheme()">Save theme</button></div>`;
  }

  if(activeTab==='Loading & SEO'){
    c.innerHTML=`<div class="box"><h2>Loading screen</h2>
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="l_en" style="width:auto;" ${l.enabled==1?'checked':''}> Enabled</label>
      <label>Duration (ms)</label><input type="number" id="l_dur" value="${l.duration_ms||2000}">
      <label>Loading text</label><input id="l_text" value="${esc(l.loader_text)}">
      <button class="btn" onclick="saveLoader()">Save loading screen</button></div>
      <div class="box"><h2>SEO</h2>
      <label>Page title</label><input id="s_title" value="${esc(seo.title)}">
      <label>Meta description</label><input id="s_desc" value="${esc(seo.description)}">
      <label>Keywords</label><input id="s_kw" value="${esc(seo.keywords)}">
      <button class="btn" onclick="saveSeo()">Save SEO</button></div>`;
  }

  if(activeTab==='Security'){
    c.innerHTML=`<div class="box"><h2>Admin credentials</h2>
      <p class="pill">Username: ${esc((DATA.admin||{}).username||'')}</p>
      <label>Current password</label><input id="sec_cur" type="password">
      <label>New username (optional)</label><input id="sec_user">
      <label>New password (optional, min 8 chars)</label><input id="sec_pass" type="password">
      <button class="btn" onclick="saveAccount()">Update credentials</button></div>`;
  }
}

async function saveProfile(){
  const p=DATA.profile;
  const body={name:document.getElementById('f_name').value,tagline:document.getElementById('f_tag').value,about:document.getElementById('f_about').value,badge:document.getElementById('f_badge').checked,stats:p.stats};
  const file=document.getElementById('f_dp').files[0];
  if(file){
    const fd=new FormData(); fd.append('file',file);
    const up = await fetch(API+'upload.php',{method:'POST',credentials:'include',body:fd}).then(r=>r.json());
    if(!up.ok){ alert(up.error); return; }
    body.dp_path = up.path;
  }
  const r = await j('profile.php',{method:'POST',body:JSON.stringify(body)});
  if(r.ok){ await refresh(); alert('Profile saved.'); } else alert(r.error);
}
function addStat(){ DATA.profile.stats.push({label:'New stat',value:'0'}); renderContent(); }
function delStat(i){ DATA.profile.stats.splice(i,1); renderContent(); }
async function saveStatsOnly(){
  const p=DATA.profile;
  await j('profile.php',{method:'POST',body:JSON.stringify({name:p.name,tagline:p.tagline,about:p.about,badge:p.badge==1,stats:p.stats})});
  await refresh(); alert('Stats saved.');
}

async function addSoc(){
  const type=document.getElementById('ns_type').value, url=document.getElementById('ns_url').value.trim();
  if(!url) return;
  const r = await j('socials.php',{method:'POST',body:JSON.stringify({action:'create',type,url})});
  if(!r.ok){ alert(r.error); return; }
  await refresh(); renderContent();
}
async function delSoc(id){ await j('socials.php',{method:'POST',body:JSON.stringify({action:'delete',id})}); await refresh(); renderContent(); }
async function toggleSoc(id){ await j('socials.php',{method:'POST',body:JSON.stringify({action:'toggle',id})}); await refresh(); renderContent(); }
async function moveSoc(id,dir){
  const socs=[...DATA.socials].sort((a,b)=>a.sort_order-b.sort_order);
  const i=socs.findIndex(s=>s.id===id), j2=i+dir; if(j2<0||j2>=socs.length) return;
  await j('socials.php',{method:'POST',body:JSON.stringify({action:'reorder',a:id,b:socs[j2].id})});
  await refresh(); renderContent();
}

async function addSec(){ const r=await j('sections.php',{method:'POST',body:JSON.stringify({action:'create'})}); if(r.ok){ await refresh(); renderContent(); } }
async function delSec(id){ await j('sections.php',{method:'POST',body:JSON.stringify({action:'delete',id})}); await refresh(); renderContent(); }
async function toggleSec(id){ await j('sections.php',{method:'POST',body:JSON.stringify({action:'toggle',id})}); await refresh(); renderContent(); }
async function moveSec(id,dir){
  const secs=[...DATA.sections].sort((a,b)=>a.sort_order-b.sort_order);
  const i=secs.findIndex(s=>s.id===id), j2=i+dir; if(j2<0||j2>=secs.length) return;
  await j('sections.php',{method:'POST',body:JSON.stringify({action:'reorder',a:id,b:secs[j2].id})});
  await refresh(); renderContent();
}
function editSec(id){
  const s=DATA.sections.find(s=>s.id===id);
  document.getElementById('secEditor').innerHTML=`<div class="box"><h2>Edit section</h2>
    <label>Title</label><input id="es_title" value="${esc(s.title)}">
    <label>Description</label><textarea id="es_desc">${esc(s.description)}</textarea>
    <label>Icon (emoji)</label><input id="es_icon" value="${esc(s.icon)}">
    <label>Image (optional)</label><input id="es_image" type="file" accept="image/*">
    <label>Button text</label><input id="es_btntext" value="${esc(s.btn_text)}">
    <label>Button URL</label><input id="es_btnurl" value="${esc(s.btn_url)}">
    <button class="btn" onclick="saveSec(${id})">Save section</button></div>`;
}
async function saveSec(id){
  const body={action:'update',id,title:document.getElementById('es_title').value,description:document.getElementById('es_desc').value,icon:document.getElementById('es_icon').value,btn_text:document.getElementById('es_btntext').value,btn_url:document.getElementById('es_btnurl').value};
  const file=document.getElementById('es_image').files[0];
  if(file){
    const fd=new FormData(); fd.append('file',file);
    const up = await fetch(API+'upload.php',{method:'POST',credentials:'include',body:fd}).then(r=>r.json());
    if(up.ok) body.image_path=up.path;
  }
  await j('sections.php',{method:'POST',body:JSON.stringify(body)});
  await refresh(); document.getElementById('secEditor').innerHTML=''; renderContent();
}

async function saveTheme(){
  const body={primary_color:document.getElementById('t_primary').value,secondary_color:document.getElementById('t_secondary').value,bg_color:document.getElementById('t_bg').value,glow:parseFloat(document.getElementById('t_glow').value),animations:document.getElementById('t_anim').checked};
  await j('theme.php',{method:'POST',body:JSON.stringify(body)});
  await refresh(); alert('Theme saved.');
}
async function saveLoader(){
  const body={enabled:document.getElementById('l_en').checked,duration_ms:parseInt(document.getElementById('l_dur').value)||2000,loader_text:document.getElementById('l_text').value};
  await j('loader.php',{method:'POST',body:JSON.stringify(body)});
  alert('Loading screen saved.');
}
async function saveSeo(){
  const body={title:document.getElementById('s_title').value,description:document.getElementById('s_desc').value,keywords:document.getElementById('s_kw').value};
  await j('seo.php',{method:'POST',body:JSON.stringify(body)});
  alert('SEO settings saved.');
}
async function saveAccount(){
  const body={current_password:document.getElementById('sec_cur').value};
  const nu=document.getElementById('sec_user').value.trim(); const np=document.getElementById('sec_pass').value;
  if(nu) body.username=nu; if(np) body.password=np;
  const r = await j('account.php',{method:'POST',body:JSON.stringify(body)});
  if(r.ok){ alert('Credentials updated.'); await refresh(); } else alert(r.error);
}

init();
</script>
</body>
</html>
